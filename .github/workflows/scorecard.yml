# OpenSSF Scorecard: nota pública de práticas de segurança do repositório.
#
# Só funciona em repositório público. Avalia pinagem de dependência, permissão
# de token, branch protection, revisão de código e afins — e publica o
# resultado na aba Security, com badge opcional no README.

name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '17 4 * * 1'
  push:
    branches: [main]

permissions: read-all

jobs:
  analise:
    name: Análise do Scorecard
    runs-on: ubuntu-latest
    permissions:
      security-events: write # publica o SARIF na aba Security
      id-token: write # assina o resultado para o badge público
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          # Torna a nota consultável publicamente pela API do OpenSSF, que é o
          # que alimenta o badge.
          publish_results: true
      - uses: github/codeql-action/upload-sarif@e60ea984bd3baa95954f2856bcf24f9eaba46637 # v3
        with:
          sarif_file: scorecard.sarif
