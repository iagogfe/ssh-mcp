name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Read-only by default: this workflow runs code from forked pull requests.
permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      sshd:
        image: lscr.io/linuxserver/openssh-server:latest
        env:
          USER_NAME: test
          PASSWORD_ACCESS: "true"
          USER_PASSWORD: secret
          SUDO_ACCESS: "true"
        ports:
          - 2222:2222
        options: >-
          --health-cmd="nc -z localhost 2222 || exit 1"
          --health-interval=2s
          --health-timeout=2s
          --health-retries=30
    steps:
      # Third-party actions are pinned by commit SHA, not by mutable tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - run: npm ci
      - name: Wait for sshd
        run: |
          for i in {1..60}; do
            nc -z 127.0.0.1 2222 && echo "sshd ready" && exit 0
            sleep 1
          done
          echo "sshd not ready" && exit 1
      - name: Run tests
        env:
          SSH_MCP_DISABLE_MAIN: "1"
          SSH_HOST: 127.0.0.1
          SSH_PORT: "2222"
          SSH_USER: test
          SSH_PASSWORD: secret
        run: npm test
