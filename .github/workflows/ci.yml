# Build, type-check e suíte de testes.
#
# Este repositório é público, então a pipeline é autocontida: um repositório
# público não consegue chamar reusable workflow de repositório privado, o que
# descarta reaproveitar `iagogfe/workflows` aqui.
#
# Actions de terceiros pinadas por SHA completo — tag é mutável, e foi o vetor
# dos ataques tj-actions (mar/2025) e trivy-action (mar/2026). O Dependabot
# atualiza os SHAs e o comentário da versão junto.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build e testes (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `engines` do package.json exige >= 20 desde a migração para o SDK v2,
        # que também exige Node 20+. Testar no 18 daria um verde que não valia nada.
        node: ['20', '22', '24']
    services:
      # A suíte fala com um sshd de verdade: os testes sobem o servidor MCP e
      # executam comandos remotos, então um mock não provaria nada.
      sshd:
        image: lscr.io/linuxserver/openssh-server:latest
        env:
          USER_NAME: test
          PASSWORD_ACCESS: "true"
          USER_PASSWORD: secret
          SUDO_ACCESS: "true"
        ports:
          - 2222:2222
        options: >-
          --health-cmd="nc -z localhost 2222 || exit 1"
          --health-interval=2s
          --health-timeout=2s
          --health-retries=30
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

      - name: Conferir os artefatos de build
        # O `files` do package.json publica `build/`, então um build que gere
        # menos que isto quebraria o pacote sem quebrar o build.
        run: |
          for alvo in build/index.js build/output.js; do
            if [ ! -e "$alvo" ]; then
              echo "::error::build não gerou $alvo"
              exit 1
            fi
          done
          echo "artefatos presentes"

      - name: Esperar o sshd
        run: |
          for i in {1..60}; do
            nc -z 127.0.0.1 2222 && echo "sshd pronto" && exit 0
            sleep 1
          done
          echo "::error::sshd não respondeu na porta 2222"
          exit 1

      - name: Testes
        env:
          SSH_MCP_DISABLE_MAIN: "1"
          SSH_HOST: 127.0.0.1
          SSH_PORT: "2222"
          SSH_USER: test
          SSH_PASSWORD: secret
        run: npm test

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.node == '22'
        with:
          name: build
          path: build/
          retention-days: 7
